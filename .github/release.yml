# Categories of the notes GitHub generates for a release, when notes are not given.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Operations and inputs
      labels: [operations, inputs]
    - title: Execution and errors
      labels: [execution, errors]
    - title: Deferred calls
      labels: [queue]
    - title: Around the gem
      labels: [events, testing, rubocop, docs]
    - title: Other changes
      labels: ['*']
